[Service]
Environment=QT_QPA_PLATFORMTHEME=qtengine
Environment=QT_QPA_PLATFORMTHEME_QT6=qtengine
EnvironmentFile=-%E/dux-shell/niri.env
ExecStartPre=/usr/libexec/dux-niri-environment start
ExecStopPost=/usr/libexec/dux-niri-environment stop
# Allow login even if initialization fails.
ExecStartPre=-/usr/libexec/dux-niri-setup
