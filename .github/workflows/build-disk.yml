---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
      disk-type:
        description: "Artifacts to build"
        type: choice
        default: all
        options: [all, anaconda-iso, qcow2]
      gnome-digest:
        description: "Optional verified GNOME image digest (sha256:...)"
        type: string
      kde-digest:
        description: "Optional verified KDE image digest (sha256:...)"
        type: string
  pull_request:
    branches:
      - main
    paths:
      - 'disk_config/**'
      - '.github/workflows/build-disk.yml'
      - '.github/scripts/verify-iso.py'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.desktop }} / ${{ matrix.disk-type }} (amd64)
    # Dux Shell's prebuilt release and the Chrome repository require amd64.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        desktop: [gnome, kde]
        disk-type: ${{ fromJSON(inputs.disk-type == 'anaconda-iso' && '["anaconda-iso"]' || inputs.disk-type == 'qcow2' && '["qcow2"]' || '["qcow2", "anaconda-iso"]') }}
    env:
      DESKTOP: ${{ matrix.desktop }}
      SOURCE_DIGEST: ${{ inputs[format('{0}-digest', matrix.desktop)] }}
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          IMAGE_NAME+="-$DESKTOP"
          IMAGE_REGISTRY="${IMAGE_REGISTRY,,}"
          IMAGE_NAME="${IMAGE_NAME,,}"
          IMAGE_SOURCE="$IMAGE_REGISTRY/$IMAGE_NAME:$DEFAULT_TAG"
          if [[ -n "$SOURCE_DIGEST" ]]; then
            [[ "$SOURCE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Invalid image digest" >&2; exit 1; }
            IMAGE_SOURCE="$IMAGE_REGISTRY/$IMAGE_NAME@$SOURCE_DIGEST"
          fi
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          {
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            echo "IMAGE_NAME=${IMAGE_NAME,,}"
            echo "IMAGE_SOURCE=$IMAGE_SOURCE"
            echo "DISK_TYPE=${DISK_TYPE}"
            echo "USER_UID=${USER_UID}"
            echo "USER_GID=${USER_GID}"
          } >> "$GITHUB_ENV"

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The builder action pulls images with rootful Podman.
          printf '%s' "$REGISTRY_PASSWORD" | sudo podman login \
            --username "$REGISTRY_USER" --password-stdin ghcr.io

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && format('./disk_config/iso-{0}.toml', matrix.desktop) || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_SOURCE }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          rootfs: btrfs
          types: ${{ matrix.disk-type }}
          additional-args: --use-librepo=True

      - name: Verify and save artifact checksum
        env:
          ARTIFACT_PATH: ${{ steps.build.outputs[format('{0}-output-path', matrix.disk-type)] }}
          ARTIFACT_SHA256: ${{ steps.build.outputs[format('{0}-output-checksum', matrix.disk-type)] }}
        run: |
          test -s "$ARTIFACT_PATH"
          [[ "$ARTIFACT_SHA256" =~ ^[[:xdigit:]]{64}$ ]]
          cd "$(dirname "$ARTIFACT_PATH")"
          artifact=$(basename "$ARTIFACT_PATH")
          printf '%s  %s\n' "$ARTIFACT_SHA256" "$artifact" > "$artifact-CHECKSUM"
          sha256sum --check "$artifact-CHECKSUM"
          printf '%s\n' "$IMAGE_SOURCE" > source-image.txt

      - name: Boot ISO installer under QEMU
        if: matrix.disk-type == 'anaconda-iso'
        timeout-minutes: 35
        env:
          ISO_PATH: ${{ steps.build.outputs.anaconda-iso-output-path }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso
          python3 .github/scripts/verify-iso.py "$ISO_PATH" "$RUNNER_TEMP/iso-smoke" "$DESKTOP"

      - name: Upload ISO boot verification logs
        if: always() && matrix.disk-type == 'anaconda-iso'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.IMAGE_NAME }}-iso-boot-verification
          path: ${{ runner.temp }}/iso-smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.IMAGE_NAME }}-${{ env.DEFAULT_TAG }}-amd64-${{ matrix.disk-type }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
      
      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy "$SOURCE_DIR" "S3:${{ secrets.S3_BUCKET_NAME }}/$IMAGE_NAME/$DEFAULT_TAG/amd64/$DISK_TYPE"
