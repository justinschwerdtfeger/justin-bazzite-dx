---
name: Build container image
on:
  pull_request:
    branches:
      - main
    paths:
      - 'Containerfile'
      - 'build_files/**'
      - 'system_files/**'
      - '.github/workflows/build.yml'
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths:
      - 'Containerfile'
      - 'build_files/**'
      - 'system_files/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      fresh-build:
        description: 'Ignore cached build layers'
        type: boolean
        default: false

env:
  IMAGE_DESC: "My Customized Universal Blue Image"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"  # Put your own image here for a fancy profile on https://artifacthub.io/!
  IMAGE_NAME: "${{ github.event.repository.name }}"  # output image name, usually same as repo name
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      # Use rootful native overlay rather than the build action's automatic
      # fuse-overlayfs override. Linting and committing a large OS image can
      # otherwise spend many minutes traversing its filesystem.
      - name: Configure container storage
        run: |
          STORAGE_CONFIG="$RUNNER_TEMP/storage.conf"
          cat > "$STORAGE_CONFIG" <<EOF
          [storage]
          driver = "overlay"
          runroot = "$RUNNER_TEMP/containers-run"
          graphroot = "$RUNNER_TEMP/containers-storage"
          [storage.options.overlay]
          mount_program = ""
          EOF
          echo "CONTAINERS_STORAGE_CONF=$STORAGE_CONFIG" >> "$GITHUB_ENV"
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/registry-auth.json" >> "$GITHUB_ENV"
          install -m 600 /dev/null "$RUNNER_TEMP/registry-auth.json"
          echo '{"auths":{}}' > "$RUNNER_TEMP/registry-auth.json"
          sudo env CONTAINERS_STORAGE_CONF="$STORAGE_CONFIG" buildah info

      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # Invalidate package installation daily, including scheduled builds.
          echo "package_refresh=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # Image metadata for https://artifacthub.io/ - This is optional but is highly recommended so we all can get a index of all the custom images
      # The metadata by itself is not going to do anything, you choose if you want your image to be on ArtifactHub or not.
      - name: Image Metadata
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v5
        id: metadata
        with:
          # This generates all the tags for your image, you can add custom tags here too!
          # Default tags are "$DEFAULT_TAG" and "$DEFAULT_TAG.$date".
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Login to GitHub Container Registry
        # Same-repository PRs can also read a private cache package.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Cosign reads Docker's credentials, not Buildah's auth file.
          printf '%s' "$REGISTRY_PASSWORD" | docker login \
            --username "$REGISTRY_USER" --password-stdin ghcr.io
          printf '%s' "$REGISTRY_PASSWORD" | sudo buildah login \
            --authfile "$REGISTRY_AUTH_FILE" \
            --username "$REGISTRY_USER" --password-stdin ghcr.io

      - name: Build Image
        env:
          IMAGE_LABELS: ${{ steps.metadata.outputs.labels }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
          PACKAGE_REFRESH: ${{ steps.date.outputs.package_refresh }}
          FRESH_BUILD: ${{ inputs.fresh-build == true }}
          PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          USE_CACHE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          BUILD_ARGS=(--layers --pull=always --format=docker)
          BUILD_ARGS+=(--build-arg "PACKAGE_REFRESH=$PACKAGE_REFRESH")
          BUILD_ARGS+=(--build-arg "DUX_SHELL_REFRESH=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          # Include mounted script contents explicitly in the cache key.
          BUILD_ARGS+=(--build-arg "BUILD_SCRIPTS_SHA=$(find build_files -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)")
          CACHE_IMAGE="$IMAGE_REGISTRY/$IMAGE_NAME-build-cache"
          if [[ "$FRESH_BUILD" == true ]]; then
            BUILD_ARGS+=(--no-cache)
          elif [[ "$USE_CACHE" == true ]]; then
            BUILD_ARGS+=(--cache-from "$CACHE_IMAGE" --cache-ttl=48h)
          fi
          # Only default-branch builds may write the shared cache.
          if [[ "$PUBLISH" == true ]]; then
            BUILD_ARGS+=(--cache-to "$CACHE_IMAGE")
          fi
          while IFS= read -r label; do
            [[ -z "$label" ]] || BUILD_ARGS+=(--label "$label")
          done <<< "$IMAGE_LABELS"
          read -r -a TAGS <<< "$IMAGE_TAGS"
          for tag in "${TAGS[@]}"; do
            BUILD_ARGS+=(--tag "$IMAGE_NAME:$tag")
          done
          sudo env CONTAINERS_STORAGE_CONF="$CONTAINERS_STORAGE_CONF" \
            REGISTRY_AUTH_FILE="$REGISTRY_AUTH_FILE" \
            buildah build "${BUILD_ARGS[@]}" --file Containerfile .

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          read -r -a TAGS <<< "$IMAGE_TAGS"
          for tag in "${TAGS[@]}"; do
            sudo env CONTAINERS_STORAGE_CONF="$CONTAINERS_STORAGE_CONF" \
              REGISTRY_AUTH_FILE="$REGISTRY_AUTH_FILE" \
              buildah push --digestfile "$RUNNER_TEMP/image-digest.txt" \
              "$IMAGE_NAME:$tag" "docker://$IMAGE_REGISTRY/$IMAGE_NAME:$tag"
          done
          echo "digest=$(cat "$RUNNER_TEMP/image-digest.txt")" >> "$GITHUB_OUTPUT"

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "$IMAGE_FULL@$IMAGE_DIGEST"
        env:
          IMAGE_FULL: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
