---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
  pull_request:
    branches:
      - main
    paths:
      - 'disk_config/**'
      - 'build_files/render-iso-config.py'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.desktop }} / ${{ matrix.disk-type }} (amd64)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        desktop: [gnome, kde]
        disk-type: ["qcow2", "anaconda-iso"]
    env:
      DESKTOP: ${{ matrix.desktop }}
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          if [[ "$DESKTOP" == kde ]]; then IMAGE_NAME+="-kde"; fi
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          {
            echo "BIB_IMAGE=$(cat disk_config/builder-image)"
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            echo "IMAGE_NAME=${IMAGE_NAME,,}"
            echo "DISK_TYPE=${DISK_TYPE}"
            echo "USER_UID=${USER_UID}"
            echo "USER_GID=${USER_GID}"
          } >> "$GITHUB_ENV"

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Render installer configuration
        if: matrix.disk-type == 'anaconda-iso'
        run: |
          python3 build_files/render-iso-config.py \
            "$IMAGE_REGISTRY/$IMAGE_NAME:$DEFAULT_TAG" \
            "$RUNNER_TEMP/iso.toml"

      # Keep the invocation identical to Just's pinned BIB CLI, without a
      # deprecated action translating flags for a different builder version.
      - name: Build disk images
        id: build
        env:
          DISK_TYPE: ${{ matrix.disk-type }}
        run: |
          IMAGE_REF="$IMAGE_REGISTRY/$IMAGE_NAME:$DEFAULT_TAG"
          CONFIG="$GITHUB_WORKSPACE/disk_config/disk.toml"
          if [[ "$DISK_TYPE" == anaconda-iso ]]; then
            CONFIG="$RUNNER_TEMP/iso.toml"
          fi
          OUTPUT_DIR="$RUNNER_TEMP/output/$DESKTOP/$DISK_TYPE"
          mkdir -p "$OUTPUT_DIR"
          sudo podman pull "$IMAGE_REF"
          sudo podman run --rm --privileged --pull=newer --net=host \
            --security-opt label=type:unconfined_t \
            -v "$CONFIG:/config.toml:ro" \
            -v "$OUTPUT_DIR:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$BIB_IMAGE" build "$IMAGE_REF" \
            --type "$DISK_TYPE" --config /config.toml --output /output --use-librepo --rootfs=btrfs \
            --chown "$USER_UID:$USER_GID"
          echo "output-directory=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.IMAGE_NAME }}-${{ env.DEFAULT_TAG }}-amd64-${{ matrix.disk-type }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
      
      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy "$SOURCE_DIR" "S3:${{ secrets.S3_BUCKET_NAME }}/$IMAGE_NAME/$DEFAULT_TAG/amd64/$DISK_TYPE"
